engine:
  package: "@claudinite/cli-rc"
  version: "1.61005.1"
  manifest: "sha512-A2Nxs0zPVGkFq7vJ3BQMo7WKz/5hj8JG1OwuHj7D2SCpXyhi288LfinY8xKIERXeAhmleGE4BOAEwPTyTxboew=="
packs:
  channel: "canary"
  declared:
    - id: "basics"
      config:
        sharedConstants:
          - what: "extension version — one X.Y.Z token per file, kept identical across the manifest and package.json (bumped by the canon daily auto-release and the human \"bump version\" flow); regex so it needs no re-pinning on a bump"
            value: "\"version\": \"\\d+\\.\\d+\\.\\d+\""
            regex: true
            counts:
              "extension/manifest.json": 1
              "package.json": 1
    - "chrome-extension"
    - "executable-requirements"
    - "git-github"
    - "node"
    - "spec-driven-product"
    - "product-wiki"
    - "claudinite-growth"
    - "local/gcec"
    - id: "claude-code-web-users-support"
      config:
        repo: "missingbulb/Shepherd"
    - "claudinite-lifecycle"
    - id: "claudinite-tasks"
      config:
        agenticTaskInvocationEndpoints:
          default:
            url: "https://api.anthropic.com/v1/claude_code/routines/trig_011iVaE4F36rAHBncAWnmXY2/fire"
            tokenSecret: "CCR_ROUTINE_TOKEN"
checks:
  accept:
    - rule: "adoption-answers-pending"
      path: ".claudinite-settings.json"
      reason: "false positive from this branch's own settings-file rename (migration 2026-08-23-settings-file-rename): the check's base/head pairing (packs/claudinite-lifecycle/skills/adopt-pack/checks.mjs, via engine/checks/helpers/work.mjs jsonPair/readBase) reads both sides at the SAME literal filename, so on the exact branch that renames the settings file, readBase(the new name) finds nothing at the merge-base and every already-declared pack misreads as newly added. Every already-pending adoption question (pre-existing on main, unrelated to this update) then trips as a blocking new-pack omission. Explained in full on GoogleCalendarEventCreator#1029. Prune this once the check gains rename-awareness (or the real pending questions get answered, which would also need this removed first so the answers actually get reviewed)."
    - rule: "scheduler-workflow-shape"
      path: ".github/workflows/claudinite-scheduler.yml"
      reason: "the owner cut this repo to one tick a day to halve its scheduled runs; daily-period tasks still run, and drain-tick work waits for the next day's tick."
